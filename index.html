r.", "hebrew": "הוא גבוה ממני.", "translate": "He is taller than me."}, "11": {"order": "have / I / finished.", "orderAnswer": "I have finished.", "wrong": "He have arrived.", "fixed": "He has arrived.", "hebrew": "סיימתי את העבודה.", "translate": "I have finished the work."}, "12": {"order": "rains, / If / I / will stay home.", "orderAnswer": "If it rains, I will stay home.", "wrong": "If I will study, I will pass.", "fixed": "If I study, I will pass.", "hebrew": "אם אלמד, אצליח.", "translate": "If I study, I will succeed."}, "13": {"order": "was / The letter / sent.", "orderAnswer": "The letter was sent.", "wrong": "The room cleaned yesterday.", "fixed": "The room was cleaned yesterday.", "hebrew": "הדלת נפתחה.", "translate": "The door was opened."}, "14": {"order": "should / You / rest.", "orderAnswer": "You should rest.", "wrong": "She can to swim.", "fixed": "She can swim.", "hebrew": "אתה חייב ללמוד.", "translate": "You must study."}, "15": {"order": "an / I / ate / apple.", "orderAnswer": "I ate an apple.", "wrong": "She has a umbrella.", "fixed": "She has an umbrella.", "hebrew": "ראיתי כלב.", "translate": "I saw a dog."}, "16": {"order": "on / We / meet / Monday.", "orderAnswer": "We meet on Monday.", "wrong": "I wake up in 7.", "fixed": "I wake up at 7.", "hebrew": "ניפגש ביום שישי.", "translate": "We will meet on Friday."}, "17": {"order": "some / We / need / water.", "orderAnswer": "We need some water.", "wrong": "I have many money.", "fixed": "I have a lot of money.", "hebrew": "יש לי שלושה ספרים.", "translate": "I have three books."}, "18": {"order": "than / He / is / taller / me.", "orderAnswer": "He is taller than me.", "wrong": "This is the more interesting.", "fixed": "This is the most interesting.", "hebrew": "היא הכי גבוהה.", "translate": "She is the tallest."}, "19": {"order": "can / They / swim.", "orderAnswer": "They can swim.", "wrong": "He musts leave.", "fixed": "He must leave.", "hebrew": "כדאי לך לנוח.", "translate": "You should rest."}, "20": {"order": "If / I / practice, / I / will improve.", "orderAnswer": "If I practice, I will improve.", "wrong": "If it will rain, we will leave.", "fixed": "If it rains, we will leave.", "hebrew": "אם תבוא, אשמח.", "translate": "If you come, I will be happy."}, "21": {"order": "have / I / never / been there.", "orderAnswer": "I have never been there.", "wrong": "Have you ever went there?", "fixed": "Have you ever been there?", "hebrew": "מעולם לא הייתי שם.", "translate": "I have never been there."}, "22": {"order": "is / English / spoken / here.", "orderAnswer": "English is spoken here.", "wrong": "The cake was make yesterday.", "fixed": "The cake was made yesterday.", "hebrew": "המכתב נכתב.", "translate": "The letter was written."}};
function grammar(){return panel('✍️ בית הספר לדקדוק',`<p class="muted">בחר נושא, קרא הסבר בעברית ותרגל שאלות. אפשר ליצור סט תרגול חדש.</p><div class="controls"><select id="gselect" aria-label="בחירת שיעור">${DATA.grammar.map(g=>`<option value="${g.id}" ${g.id===grammarId?'selected':''}>${state.grammarDone.includes(g.id)?'✓ ':''}${escapeHtml(g.title)} · ${g.level}</option>`).join('')}</select></div><div id="gbody"></div>`)}
function renderGrammar(){const g=DATA.grammar.find(x=>x.id===grammarId),guide=GRAMMAR_GUIDES[g.id],ex=GRAMMAR_PRACTICE[g.id];$('#gbody').innerHTML=`<h3>${escapeHtml(g.title)} <span class="tag">${g.level}</span></h3><p>${escapeHtml(g.explanation)}</p><div class="question" dir="ltr" style="text-align:left">${g.examples.map(e=>`<div>${escapeHtml(e)}</div>`).join('')}</div><div class="grammar-guide"><h3>📘 להבין את הכלל</h3><p><b>מבנה:</b> <span dir="ltr" class="english">${escapeHtml(guide.pattern)}</span></p><p>${escapeHtml(guide.tip)}</p><p dir="ltr" style="text-align:left"><b>Example:</b> ${escapeHtml(guide.example)}</p></div><h3>תרגול · ${Math.min(8,g.questions.length)} שאלות מתוך ${g.questions.length}</h3><p class="muted small">לחץ על 'סט חדש' לקבלת תרגול בסדר משתנה.</p><button class="btn" onclick="grammarRound++;renderGrammar()">↻ סט חדש</button>${[...g.questions].sort((a,b)=>((a.question.length*17+grammarRound*31)%101)-((b.question.length*17+grammarRound*31)%101)).slice(0,8).map((q,i)=>questionHtml(q.question,q.options,q.answer,`grammar-${g.id}-${grammarRound}-${i}`)).join('')}<div class="grammar-guide"><h3>🧩 תרגול מעשי נוסף</h3><p class="muted small">כתוב תשובה בעצמך, ואז בדוק אותה. התרגילים נועדו לחזק את ההבנה ולא רק לזהות תשובה אמריקאית.</p><div class="practice-unit"><b>1. סדר את המילים למשפט תקין</b><p dir="ltr" class="english">${escapeHtml(ex.order)}</p><input id="practice-order" dir="ltr" placeholder="Write the complete sentence" aria-label="סדר את המשפט"><button class="btn" onclick="checkGrammarPractice('order')">בדוק תשובה</button><div id="result-order" aria-live="polite"></div></div><div class="practice-unit"><b>2. תקן את הטעות במשפט</b><p dir="ltr" class="english">${escapeHtml(ex.wrong)}</p><input id="practice-fix" dir="ltr" placeholder="Write the corrected sentence" aria-label="תקן את המשפט"><button class="btn" onclick="checkGrammarPractice('fix')">בדוק תשובה</button><div id="result-fix" aria-live="polite"></div></div><div class="practice-unit"><b>3. תרגם לאנגלית</b><p>${escapeHtml(ex.hebrew)}</p><input id="practice-translate" dir="ltr" placeholder="Translate into English" aria-label="תרגם לאנגלית"><button class="btn" onclick="checkGrammarPractice('translate')">בדוק תשובה</button><div id="result-translate" aria-live="polite"></div></div></div><div class="completion-actions"><button class="btn primary" onclick="markGrammar(${g.id})">${state.grammarDone.includes(g.id)?'✓ השיעור הושלם · ביטול סימון':'✓ סיימתי לתרגל את השיעור'}</button><span class="muted small">סמן לאחר שסיימת את התרגול</span></div>`}
function checkGrammarPractice(kind){const g=GRAMMAR_PRACTICE[grammarId],answer=kind==='order'?g.orderAnswer:kind==='fix'?g.fixed:g.translate,el=$('#practice-'+kind),box=$('#result-'+kind);const normalize=s=>s.toLowerCase().replace(/[’]/g,"'").replace(/[^a-z0-9' ]/g,'').replace(/\s+/g,' ').trim();if(!el.value.trim()){box.textContent='כתוב תשובה לפני הבדיקה.';return}const ok=normalize(el.value)===normalize(answer);box.innerHTML=ok?'<span class="practice-ok">✓ נכון! כל הכבוד.</span>':`<span class="practice-note">התשובה שונה מהפתרון המוצע. ייתכנו גם ניסוחים נכונים אחרים.</span><div dir="ltr" style="text-align:left"><b>פתרון לדוגמה:</b> ${escapeHtml(answer)}</div>`;state.attempts++;if(ok)state.correct++;save()}

function dictionary(){return {...DATA.words,...verifiedBasic,...expandedGlossary,...state.customWords}}
function wordMeaning(w){return state.customWords[w]||expandedGlossary[w]||DATA.words[w]||verifiedBasic[w]||''}
let reviewMode='due',reviewQueue=[],reviewPos=0,reviewShown=false,reviewSession={right:0,wrong:0},reviewChoice=null;
function availableSaved(){return [...new Set(state.words)].filter(w=>wordMeaning(w))}
function dueWords(){const now=Date.now();return availableSaved().filter(w=>!state.reviews[w]||Number(state.reviews[w].due||0)<=now)}
function wordLibrary(){return panel('🗂️ אוצר המילים שלי',`<p class="muted">מילון של ${Object.keys(dictionary()).length} ערכים באנגלית ובעברית. חפש מילים, שמור אותן ותרגל אותן בחזרות מדורגות.</p><div class="controls"><input id="wsearch" placeholder="חיפוש באנגלית או בעברית" aria-label="חיפוש מילים"><select id="wfilter"><option value="all">כל המילים</option><option value="saved">המילים ששמרתי (${state.words.length})</option></select></div><div id="wlist"></div><div class="controls"><button class="btn" id="wprev">הקודם</button><span id="wpage" class="muted small"></span><button class="btn" id="wnext">הבא</button></div><hr><h3>🧠 אימון אוצר מילים</h3><p class="muted small">בחר מצב אימון. מילים שלא זכרת יחזרו בסבב הבא; מילים שזכרת יקבלו מועד חזרה עתידי. המעקב נשמר במכשיר הזה.</p><div class="controls"><button class="btn primary" id="startdue">תרגול מילים לחזרה (${dueWords().length})</button><button class="btn" id="startall">תרגול כל המילים השמורות</button><button class="btn" id="startmc">מבחן בחירה מרובה</button></div><div id="flasharea"></div>`)}
function renderWords(){const term=($('#wsearch')?.value||'').trim().toLowerCase(),saved=$('#wfilter')?.value==='saved';const entries=Object.entries(dictionary()).filter(([w,tr])=>(!saved||state.words.includes(w))&&(!term||w.includes(term)||tr.includes(term)));const pages=Math.max(1,Math.ceil(entries.length/18));vocabPage=Math.min(vocabPage,pages-1);const chunk=entries.slice(vocabPage*18,vocabPage*18+18);$('#wlist').innerHTML=chunk.map(([w,tr])=>`<div class="word-row"><div><span class="english">${escapeHtml(w)}</span><span class="muted"> — ${escapeHtml(tr)}</span></div><div><button class="btn" data-say="${escapeHtml(w)}" title="השמעה">🔊</button> <button class="btn" data-save="${escapeHtml(w)}">${state.words.includes(w)?'✓ שמורה':'＋ שמור'}</button></div></div>`).join('')||'<p class="muted">לא נמצאו מילים.</p>';$('#wpage').textContent=`עמוד ${vocabPage+1} מתוך ${pages} · ${entries.length} מילים`;$('#wprev').disabled=vocabPage===0;$('#wnext').disabled=vocabPage>=pages-1;document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(b.dataset.say));document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{toggleWord(b.dataset.save);renderWords()});$('#startdue').onclick=()=>startReview('due');$('#startall').onclick=()=>startReview('all');$('#startmc').onclick=()=>startReview('mc');renderFlash()}
function startReview(mode){reviewMode=mode;reviewQueue=(mode==='due'?dueWords():availableSaved()).sort(()=>Math.random()-.5);reviewPos=0;reviewShown=false;reviewChoice=null;reviewSession={right:0,wrong:0};renderFlash()}
function reviewAnswer(w,known){const prev=state.reviews[w]||{interval:0};const days=known?(prev.interval===0?1:Math.min(60,Math.max(2,Math.round(prev.interval*2.2)))):0;state.reviews[w]={interval:days,due:Date.now()+(known?days:0)*86400000,seen:(prev.seen||0)+1,correct:(prev.correct||0)+(known?1:0)};save();reviewSession[known?'right':'wrong']++;reviewPos++;reviewShown=false;reviewChoice=null;renderFlash()}
function nextReview(){reviewPos++;reviewShown=false;reviewChoice=null;renderFlash()}
function renderFlash(){const box=$('#flasharea');if(!box)return;if(!reviewQueue.length){box.innerHTML=`<div class="flash"><p>${availableSaved().length?'אין מילים בסבב הנוכחי. בחר מצב אימון כדי להתחיל.':'עדיין לא שמרת מילים. פתח מאמר ולחץ על מילה כדי לשמור אותה.'}</p></div>`;return}if(reviewPos>=reviewQueue.length){box.innerHTML=`<div class="flash"><h3>🎉 הסבב הושלם</h3><p>זכרת: <b>${reviewSession.right}</b> · לתרגול נוסף: <b>${reviewSession.wrong}</b></p><p class="muted small">מילים שלא זכרת יופיעו שוב בתרגול המילים לחזרה.</p><button class="btn primary" id="restartreview">התחל סבב חדש</button></div>`;$('#restartreview').onclick=()=>startReview(reviewMode);return}const w=reviewQueue[reviewPos],meaning=wordMeaning(w);if(!meaning){nextReview();return}const status=`${reviewPos+1} מתוך ${reviewQueue.length}`;if(reviewMode==='mc'){const pool=Object.entries(dictionary()).filter(([k,v])=>k!==w&&v&&v!==meaning).sort(()=>Math.random()-.5).slice(0,3).map(([,v])=>v);const opts=[meaning,...pool].sort(()=>Math.random()-.5);if(!reviewShown){reviewChoice={opts,answer:meaning}}const choices=reviewChoice.opts;box.innerHTML=`<div class="flash"><p class="muted small">${status} · בחר את הפירוש המתאים</p><strong dir="ltr">${escapeHtml(w)}</strong><div class="controls" style="justify-content:center">${choices.map((v,i)=>`<button class="btn" data-choice="${i}" ${reviewShown?'disabled':''}>${escapeHtml(v)}</button>`).join('')}</div>${reviewShown?`<p>${reviewChoice.selected===meaning?'✓ נכון!':'הפירוש המתאים: '+escapeHtml(meaning)}</p><button class="btn primary" id="nextreview">הבא ←</button>`:''}</div>`;box.querySelectorAll('[data-choice]').forEach(btn=>btn.onclick=()=>{reviewChoice.selected=choices[+btn.dataset.choice];reviewShown=true;const correct=reviewChoice.selected===meaning;const prev=state.reviews[w]||{interval:0};const days=correct?(prev.interval===0?1:Math.min(60,Math.max(2,Math.round(prev.interval*2.2)))):0;state.reviews[w]={interval:days,due:Date.now()+days*86400000,seen:(prev.seen||0)+1,correct:(prev.correct||0)+(correct?1:0)};save();reviewSession[correct?'right':'wrong']++;renderFlash()});if(reviewShown)$('#nextreview').onclick=nextReview;return}
box.innerHTML=`<div class="flash"><p class="muted small">${status}</p><strong dir="ltr">${escapeHtml(w)}</strong><div style="margin:12px">${reviewShown?escapeHtml(meaning):'נסה להיזכר בפירוש לפני החשיפה'}</div><div class="controls" style="justify-content:center"><button class="btn" id="flip">${reviewShown?'הסתר פירוש':'הצג פירוש'}</button><button class="btn" id="flashsay">🔊 הגייה</button>${reviewShown?`<button class="btn" id="forgotflash">לא זכרתי</button><button class="btn primary" id="knowflash">✓ זכרתי</button>`:''}</div></div>`;$('#flip').onclick=()=>{reviewShown=!reviewShown;renderFlash()};$('#flashsay').onclick=()=>speak(w);if(reviewShown){$('#forgotflash').onclick=()=>reviewAnswer(w,false);$('#knowflash').onclick=()=>reviewAnswer(w,true)}}
function listening(){return panel('🎧 ספריית האזנה',`<p class="muted">קטעי האזנה באנגלית באמצעות מנוע הדיבור של הדפדפן. זו קריינות ממוחשבת ולא הקלטה אנושית.</p><div class="controls"><select id="lselect">${DATA.listening.map((s,i)=>`<option value="${i}">${escapeHtml(s.title)} · ${s.level}</option>`).join('')}</select><button class="btn primary" id="playlisten">▶️ השמע</button><button class="btn" id="slowlisten">🐢 השמע לאט</button><button class="btn" id="scriptbtn">הצג/הסתר תמלול</button></div><div id="lbody"></div>`)}
function renderListen(){const l=DATA.listening[listenId];$('#lbody').innerHTML=`<h3 dir="ltr" style="text-align:left">${escapeHtml(l.title)} <span class="tag">${l.level}</span></h3>${showScript?`<div class="question" dir="ltr">${escapeHtml(l.script)}</div>`:'<p class="muted">נסה להאזין לפני הצגת התמלול.</p>'}${questionHtml(l.question,l.options,l.answer,'listen-'+listenId)}`}
const speakingPrompts=['My name is Daniel, and I am learning English every day.','I usually study in the evening because I work during the day.','Technology can help people learn new skills.','If I practice regularly, I will become more confident.','I would like to travel and meet people from different countries.','A good decision requires information, patience, and careful thinking.'];let speakIndex=0;
function speaking(){return panel('🎙️ תרגול דיבור והגייה',`<p class="muted">האזן למשפט, אמור אותו בקול ואז עבור למשפט הבא. בגרסה זו אין זיהוי קולי או בדיקת איכות ההגייה.</p><div class="flash"><strong id="sprompt" style="font-size:22px">${escapeHtml(speakingPrompts[speakIndex])}</strong><div class="controls" style="justify-content:center"><button class="btn primary" id="spplay">🔊 השמע</button><button class="btn" id="spnext">המשפט הבא ←</button></div></div><p class="muted small">טיפ: השמע פעם אחת, חזור בקול פעמיים, ונסה להגיד את המשפט ללא קריאה.</p>`)}
let quizQuestions=[],quizPos=0,quizRight=0,quizAnswered=false;function buildQuiz(){quizQuestions=DATA.grammar.flatMap(g=>g.questions.map((q,i)=>({...q,id:`quiz-${g.id}-${i}`,topic:g.title}))).sort(()=>Math.random()-.5).slice(0,12);quizPos=0;quizRight=0;quizAnswered=false}
function quiz(){if(!quizQuestions.length)buildQuiz();return panel('🧩 מבחן ידע',`<p class="muted">12 שאלות מתוך מאגר ${DATA.grammar.reduce((n,g)=>n+g.questions.length,0)} שאלות הדקדוק. אפשר להתחיל מבחן חדש כדי לקבל שילוב אחר.</p><button class="btn" id="restartQuiz">↻ מבחן חדש</button><div id="quizbody"></div>`)}
function renderQuiz(){if(quizPos>=quizQuestions.length){const result={date:new Date().toLocaleString('he-IL'),right:quizRight,total:quizQuestions.length};state.scores.push(result);save();$('#quizbody').innerHTML=`<div class="hero"><h3>סיימת את המבחן! 🎉</h3><p>הציון שלך: <b>${quizRight} מתוך ${quizQuestions.length}</b> (${Math.round(quizRight/quizQuestions.length*100)}%). הציון נשמר במעקב ההתקדמות.</p></div>`;return}const q=quizQuestions[quizPos];$('#quizbody').innerHTML=`<p class="muted">שאלה ${quizPos+1} מתוך ${quizQuestions.length} · ${escapeHtml(q.topic)}</p>${questionHtml(q.question,q.options,q.answer,'test-'+quizPos)}<button class="btn primary" id="quiznext">${quizPos===quizQuestions.length-1?'סיים מבחן':'השאלה הבאה ←'}</button>`;$('#quiznext').onclick=()=>{const box=$('#quizbody');const buttons=[...box.querySelectorAll('[data-qid]')];if(!buttons.length||!buttons.every(b=>b.disabled)){alert('ענה על השאלה לפני המעבר');return}if(buttons.some(b=>b.classList.contains('correct')&&b.classList.contains('selected-answer')))quizRight++;quizPos++;renderQuiz()}}
function progress(){const pct=state.attempts?Math.round(state.correct/state.attempts*100):0;return panel('📊 ההתקדמות שלי',`<div class="stats"><div class="stat"><strong>${state.words.length}</strong>מילים שמורות</div><div class="stat"><strong>${state.read.length}</strong>טקסטים שסיימת</div><div class="stat"><strong>${state.grammarDone.length}</strong>שיעורי דקדוק שתורגלו</div><div class="stat"><strong>${pct}%</strong>תשובות נכונות מתוך ${state.attempts}</div></div><h3>חזרות אוצר מילים</h3><p>מילים שממתינות לחזרה: <b>${dueWords().length}</b> מתוך ${state.words.length} מילים שמורות.</p><h3>תוצאות מבחנים אחרונים</h3>${state.scores.length?'<div class="cardgrid">'+state.scores.slice(-8).reverse().map(x=>'<div class="item"><b>'+escapeHtml(x.date)+'</b><p>'+x.right+' / '+x.total+' · '+Math.round(x.right/x.total*100)+'%</p></div>').join('')+'</div>':'<p class="muted">עדיין אין מבחנים שהושלמו.</p>'}<h3>התקדמות בקריאה</h3><div class="progressbar"><div style="width:${Math.round(state.read.length/DATA.stories.length*100)}%"></div></div><p>${state.read.length} מתוך ${DATA.stories.length} טקסטים</p><h3>התקדמות בדקדוק</h3><div class="progressbar"><div style="width:${Math.round(state.grammarDone.length/DATA.grammar.length*100)}%"></div></div><p>${state.grammarDone.length} מתוך ${DATA.grammar.length} נושאים</p><div class="warning"><b>חשוב לגבי שמירת הנתונים</b><p>ההתקדמות נשמרת בדפדפן ובמכשיר הנוכחיים בלבד. היא לא מסתנכרנת אוטומטית בין המחשב לטלפון. אפשר לייצא גיבוי ולייבא אותו במכשיר אחר.</p></div><div class="controls"><button class="btn primary" id="export">⬇ ייצוא גיבוי</button><label class="btn" for="importfile" style="cursor:pointer">⬆ ייבוא גיבוי</label><input id="importfile" type="file" accept="application/json,.json" style="display:none"></div>`)}
function render(){const screens={home,reading,words:wordLibrary,grammar,listening,speaking,quiz,progress};$('#app').innerHTML=screens[tab]();if(tab==='reading'){['rsearch','rlevel','rtopic','rstatus'].forEach(id=>$('#'+id).addEventListener(id==='rsearch'?'input':'change',filterReading));filterReading()}if(tab==='words'){vocabPage=0;$('#wsearch').oninput=()=>{vocabPage=0;renderWords()};$('#wfilter').onchange=()=>{vocabPage=0;renderWords()};$('#wprev').onclick=()=>{vocabPage--;renderWords()};$('#wnext').onclick=()=>{vocabPage++;renderWords()};renderWords()}if(tab==='grammar'){$('#gselect').onchange=e=>{grammarId=+e.target.value;renderGrammar()};renderGrammar()}if(tab==='listening'){$('#lselect').onchange=e=>{listenId=+e.target.value;showScript=false;renderListen()};$('#playlisten').onclick=()=>speak(DATA.listening[listenId].script,.9);$('#slowlisten').onclick=()=>speak(DATA.listening[listenId].script,.68);$('#scriptbtn').onclick=()=>{showScript=!showScript;renderListen()};renderListen()}if(tab==='speaking'){$('#spplay').onclick=()=>speak(speakingPrompts[speakIndex],.82);$('#spnext').onclick=()=>{speakIndex=(speakIndex+1)%speakingPrompts.length;$('#sprompt').textContent=speakingPrompts[speakIndex]}}if(tab==='quiz'){$('#restartQuiz').onclick=()=>{buildQuiz();renderQuiz()};renderQuiz()}if(tab==='progress'){$('#export').onclick=()=>{const blob=new Blob([JSON.stringify({version:'5.3',...state},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='english-journey-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('#importfile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const d=JSON.parse(await file.text());if(!Array.isArray(d.words)||!Array.isArray(d.read)||!Array.isArray(d.grammarDone))throw Error('invalid');if(!confirm('לייבא את הגיבוי? הנתונים הנוכחיים יוחלפו.'))return;state.words=d.words.filter(x=>typeof x==='string');state.read=d.read.filter(x=>Number.isInteger(x));state.grammarDone=d.grammarDone.filter(x=>Number.isInteger(x));state.listenDone=Array.isArray(d.listenDone)?d.listenDone:[];state.correct=Number.isFinite(d.correct)?d.correct:0;state.attempts=Number.isFinite(d.attempts)?d.attempts:0;state.scores=Array.isArray(d.scores)?d.scores:[];state.customWords=d.customWords&&typeof d.customWords==='object'?d.customWords:{};state.readDates=d.readDates&&typeof d.readDates==='object'?d.readDates:{};state.grammarDates=d.grammarDates&&typeof d.grammarDates==='object'?d.grammarDates:{};state.onlineWords=d.onlineWords&&typeof d.onlineWords==='object'?d.onlineWords:{};state.reviews=d.reviews&&typeof d.reviews==='object'?d.reviews:{};save();render()}catch{alert('לא ניתן לקרוא את קובץ הגיבוי')}}}}
nav();render();
</script></body></html>
