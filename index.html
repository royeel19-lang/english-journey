area{background:white;border:1px solid #cad7e3;border-radius:10px;padding:10px;max-width:100%;min-width:135px}.controls input{flex:1;min-width:180px}.btn:hover{background:#eaf4f4}.primary{background:var(--teal)!important;border-color:var(--teal)!important}.reading{direction:ltr;text-align:left;font:19px/2.15 Georgia,serif;max-width:800px;margin:15px auto;color:#1a3046}.reading p{margin:0 0 23px}.clickword{border:0;background:transparent;color:inherit;font:inherit;padding:0 1px;border-radius:3px}.clickword:hover,.clickword:focus{background:#d7efea;color:#006a63}.definition{position:sticky;bottom:12px;background:#eaf8f5;border:1px solid #b8dfd9;border-radius:14px;padding:13px 17px;margin-top:20px;box-shadow:0 8px 25px #102d3020}.hidden{display:none!important}.question{background:#f7fafc;border:1px solid var(--line);border-radius:14px;padding:18px;margin:18px 0}.options{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.options button{background:white;border:1px solid #ccd8e3;border-radius:10px;padding:10px 14px;direction:ltr}.options button.correct{background:#dcf4e9;border-color:#60b78e}.options button.wrong{background:#ffe7e6;border-color:#d78c8b}.feedback{margin-top:10px;font-weight:bold}.article-head{display:flex;gap:15px;justify-content:space-between;align-items:start;flex-wrap:wrap}.word-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 5px;border-bottom:1px solid var(--line)}.word-row:last-child{border:0}.word-row .english{font-weight:700;direction:ltr;text-align:left}.word-row button{padding:6px 10px}.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}.flash{border:1px solid var(--line);background:#f7fafc;border-radius:18px;padding:28px;text-align:center;min-height:150px}.flash strong{font-size:27px;direction:ltr;display:block}.progressbar{height:10px;background:#e5edf2;border-radius:50px;overflow:hidden}.progressbar>div{height:100%;background:var(--teal)}.section-title{margin:22px 0 10px}.read-mark{color:#00786c}.completed{border-color:#74bca9!important;background:#f0faf5!important}.done-pill{display:inline-block;background:#d9f5e8;color:#08704c;border-radius:99px;padding:3px 9px;font-size:12px;font-weight:bold}.completion-actions{display:flex;flex-wrap:wrap;gap:9px;margin:18px 0}.note-input{padding:10px;border:1px solid #cad7e3;border-radius:10px;width:min(100%,320px)}.footer{text-align:center;color:#718098;padding:15px 10px 35px}.warning{background:#fff8e9;border:1px solid #f3dba9;border-radius:12px;padding:12px}.wide{width:100%}hr{border:0;border-top:1px solid var(--line);margin:20px 0}@media(max-width:650px){header{padding:20px}header h1{font-size:25px}.panel{padding:17px}.nav button{padding:8px 11px;font-size:14px}.reading{font-size:18px}.stats,.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{padding:12px}.controls select{flex:1}.article-head{display:block}}

</style></head><body><header><h1>English Journey 🌍</h1><p>מרכז הלמידה האישי שלך · קוראים, מבינים, מתרגלים ומתקדמים</p></header><main><nav class="nav" id="nav" aria-label="ניווט ראשי"></nav><div id="app" aria-live="polite"></div></main><div class="footer">English Journey · גרסה 5.3 · התקדמות נשמרת בדפדפן הנוכחי בלבד</div><script id="dataset" type="application/json">{"stories":[{"id":1,"title":"A New Morning Routine","topic":"חיים וסיפורים","level":"A1","body":["Daniel wanted to change his mornings. He often woke up late and looked at his phone before breakfast. When he arrived at work, he felt tired and worried. One Sunday, he decided to try something different. He put his phone on a shelf in another room and set an alarm for seven o’clock.","On Monday morning, Daniel opened the window and drank a glass of water. Then he walked around his neighborhood for twenty minutes. He saw a small dog, two people riding bicycles, and a baker opening a shop. The air was cool, and the streets were quiet. When he returned home, he made eggs and bread for breakfast.","The first day was not perfect. Daniel still wanted to check his messages. However, after one week, he noticed a change. He had more time to think and felt ready for the day. He learned that a useful routine does not need to be complicated. A few small actions, repeated often, can make a real difference."],"question":"Why did Daniel change his routine?","options":["He felt tired in the morning","He wanted a new phone","He moved to another city"],"answer":0,"words":166},{"id":2,"title":"The Missing Train Ticket","topic":"חיים וסיפורים","level":"A1","body":["Maya was going to visit her grandmother in another city. She packed a small bag with clothes, a book, and a gift. At the station, she reached into her pocket to find her train ticket. It was not there. She checked her bag twice, but she could not find it.","Maya felt nervous because the train was leaving soon. She walked to the information desk and explained the problem. The worker smiled and asked if she had bought the ticket online. Maya remembered that she had received an email the night before. She opened her phone and found the ticket in her inbox.","She thanked the worker and walked quickly to the platform. A few minutes later, she was sitting by the window, watching trees and houses pass by. Her grandmother met her at the next station. Maya told her the story, and they laughed together. Sometimes a small problem feels big until we stop, ask for help, and look carefully."],"question":"Where did Maya find her ticket?","options":["In her email","Under her seat","At her grandmother’s house"],"answer":0,"words":161},{"id":3,"title":"A Small Community Garden","topic":"סביבה וטבע","level":"A1","body":["Near Amir’s home, there was an empty piece of land. People sometimes left old boxes and plastic bags there. One day, Amir and his neighbors decided to clean it. They worked together on Saturday morning. Some people picked up rubbish, while others brought water and tools.","After cleaning the land, they planted tomatoes, flowers, and small trees. A local teacher invited children to paint signs for the garden. Every sign had the name of a plant in English and Hebrew. The children enjoyed learning new words while working outside.","During the summer, the neighbors took turns watering the plants. Not everything grew well. Some flowers needed more shade, and a few tomatoes were eaten by insects. Still, the garden became a pleasant place to meet. People who had never spoken before began sharing ideas and helping each other. The project showed that a community can improve a place through small, steady actions."],"question":"What did the neighbors create?","options":["A garden","A parking lot","A new school"],"answer":0,"words":152},{"id":4,"title":"My First Day at College","topic":"לימודים ועבודה","level":"A1","body":["On his first day at college, Ben arrived thirty minutes early. He had a notebook, a laptop, and a bottle of water. The building was larger than he expected, and he did not know where his classroom was. He asked another student for directions and found the room on the second floor.","The first lesson was about business. The teacher asked everyone to introduce themselves. Ben was worried about speaking in front of strangers, but he said his name and explained why he wanted to study. A student sitting next to him smiled and said she was also nervous.","At lunch, Ben met two classmates. They talked about their jobs, their interests, and the courses they were taking. By the end of the day, the college felt less strange. Ben understood that learning is not only about books and tests. It is also about meeting people, asking questions, and trying things that feel new."],"question":"What helped Ben feel comfortable?","options":["Meeting classmates","Leaving early","Skipping class"],"answer":0,"words":154},{"id":5,"title":"How Bees Help Our Food","topic":"מדע","level":"A2","body":["Bees are small insects, but they play an important role in many natural environments. When a bee visits a flower to collect nectar, pollen can stick to its body. As the bee moves to another flower, some of that pollen may be transferred. This process is called pollination, and it helps many plants produce seeds and fruit.","Not all food depends on bees. Some plants are pollinated by wind, other animals, or different insects. However, bees support the production of many fruits, nuts, and vegetables. Farmers sometimes place managed beehives near their fields to help crops grow.","Bees face several challenges, including the loss of flowering habitats, diseases, and exposure to certain pesticides. People can support pollinators by growing different kinds of flowers and reducing unnecessary pesticide use. Learning about bees also reminds us that living things are connected. An insect that seems unimportant can contribute to the food on our tables."],"question":"What is pollination?","options":["Moving pollen between flowers","Making honey from water","Growing flowers without seeds"],"answer":0,"words":152},{"id":6,"title":"Why the Sky Looks Blue","topic":"מדע","level":"A2","body":["Sunlight may look white, but it contains many colors. Each color has a different wavelength. When sunlight enters Earth’s atmosphere, it meets tiny molecules in the air. These molecules scatter shorter wavelengths of light more strongly than longer ones. Blue light is scattered widely across the sky.","When we look away from the Sun during a clear day, scattered blue light reaches our eyes from many directions. That is why the sky often appears blue. At sunrise and sunset, sunlight travels through more atmosphere before reaching us. Much of the shorter-wavelength light is scattered out of the direct path, so the Sun and nearby sky can look orange or red.","Clouds are different. They contain water droplets or ice crystals that scatter many colors of light, often making clouds look white or gray. The colors of the sky are a beautiful example of how physics helps us understand ordinary experiences. The next time you see a colorful sunset, you can think about the long journey of light."],"question":"Why does the daytime sky often look blue?","options":["Shorter wavelengths scatter strongly","The ocean reflects all its color","The air contains blue paint"],"answer":0,"words":167},{"id":7,"title":"The Journey of a Drop of Water","topic":"מדע","level":"A2","body":["Imagine a drop of water in the sea on a warm afternoon. Energy from the Sun helps some water change into invisible water vapor. This process is called evaporation. The vapor rises and mixes with the air. As the air cools, water vapor can turn into tiny liquid droplets, which form clouds.","Inside a cloud, droplets may grow larger when they meet other droplets. When they become heavy enough, they fall as rain. Some rain enters rivers and lakes, while some moves through the soil and becomes groundwater. Eventually, much of this water returns to the sea.","This movement is part of the water cycle. It does not mean that every drop follows exactly the same route. Some water stays frozen in ice for a long time, and some is used by plants before returning to the atmosphere. Understanding the cycle helps us see why forests, rivers, weather, and oceans are closely connected."],"question":"What is evaporation?","options":["Liquid water becoming vapor","Rain turning into ice","Clouds falling to the ground"],"answer":0,"words":153},{"id":8,"title":"A Robot in the Warehouse","topic":"טכנולוגיה","level":"A2","body":["A large warehouse can contain thousands of products. Workers need to find items, pack orders, and move boxes safely. In some warehouses, robots help with these tasks. A mobile robot may carry a shelf or a container from one part of the building to another. This can reduce the distance workers need to walk.","Robots do not make every decision alone. Software tells them where to go and helps prevent collisions. Sensors detect obstacles, and people supervise the system. When an unusual problem occurs, a human worker may need to step in and solve it.","Using robots can improve speed and consistency, but it also creates new responsibilities. Companies must train employees, maintain equipment, and think about safety. The most useful question is not whether robots will replace every person. It is how people and machines can work together to complete difficult tasks more effectively."],"question":"What helps warehouse robots avoid obstacles?","options":["Sensors and software","Painted walls only","Paper maps only"],"answer":0,"words":145},{"id":9,"title":"What Happens When You Search Online?","topic":"טכנולוגיה","level":"A2","body":["When you type a question into a search engine, the answer may appear in less than a second. Behind that simple page is a complex system. Search engines use automated programs to discover web pages. They store information about many of those pages in a large index, which works a little like a library catalog.","When you search, the system tries to find pages that match your words and meaning. It may consider the content of a page, its usefulness, and other signals. The results are then shown in an order that the system predicts will help you. Different searches can produce different results.","A high position does not guarantee that information is correct. Websites can be old, incomplete, or misleading. For important questions, it is wise to compare reliable sources and check publication dates. Search technology helps us find information quickly, but careful thinking is still essential."],"question":"What is a search index similar to?","options":["A library catalog","A telephone battery","A camera lens"],"answer":0,"words":148},{"id":10,"title":"How Password Managers Work","topic":"טכנולוגיה","level":"B1","body":["Many people use dozens of online accounts. Remembering a different strong password for every service can be difficult, so some people reuse the same password. That creates a serious risk: if one website is compromised, attackers may try the stolen password on other accounts.","A password manager helps solve this problem by generating and storing unique passwords. Typically, the saved information is protected using encryption, and the user unlocks the vault with a master password or another authentication method. The exact security design depends on the product, so it is important to choose a reputable service and understand its recovery options.","Password managers are useful, but they are not a complete security solution. People should also enable multifactor authentication where possible, keep devices updated, and remain careful about suspicious links. Good digital security usually comes from several habits working together, not from a single application."],"question":"Why is password reuse risky?","options":["One stolen password can expose other accounts","It makes typing slower","It changes the internet speed"],"answer":0,"words":145},{"id":11,"title":"The Price of a Cup of Coffee","topic":"כלכלה","level":"A2","body":["A cup of coffee may cost more in one neighborhood than in another. The difference is not always about the quality of the beans. A café pays for rent, electricity, workers, equipment, and ingredients. If these costs rise, the owner may need to increase prices or accept a smaller profit.","Demand also matters. A café near a busy train station may serve many customers who value speed and convenience. A quiet café on a side street may attract people who want to sit and work. Both businesses sell coffee, but their customers may be paying for different experiences.","Competition affects prices as well. If several cafés open close together, customers have more choices. Owners may offer lower prices, better service, or special products to attract visitors. Understanding these factors helps explain why prices are not determined by one simple rule. A price reflects costs, demand, competition, and the value customers believe they receive."],"question":"Which factor can affect coffee prices?","options":["Rent and demand","Only the cup color","Only the weather yesterday"],"answer":0,"words":153},{"id":12,"title":"Saving for a Future Goal","topic":"כלכלה","level":"A2","body":["Leah wanted to buy a new laptop for her studies. Instead of using all her money immediately, she created a savings plan. First, she checked the price of the laptop. Then she looked at her monthly income and regular expenses. She decided to put a small amount of money aside every month.","Some months were easier than others. When an unexpected expense appeared, Leah saved less. She did not give up. She reviewed her budget and continued the next month. After several months, she had saved enough to buy the computer without borrowing money.","Saving is not always possible for everyone, especially when essential expenses are high. Still, a clear goal can help people make decisions about the money they control. Leah learned that a budget is not a punishment. It is a way to understand choices and prepare for future needs."],"question":"What did Leah do first?","options":["Checked the laptop price","Bought two laptops","Borrowed money immediately"],"answer":0,"words":142},{"id":13,"title":"Why Inflation Matters","topic":"כלכלה","level":"B1","body":["Inflation describes a general increase in the prices of goods and services over time. If your income stays the same while many prices rise, your money can buy fewer things. Economists call this a loss of purchasing power. Inflation is often measured using a price index that tracks a basket of commonly purchased items.","Inflation can have several causes. Demand may grow faster than businesses can supply products, or production costs may rise because energy, materials, or transportation become more expensive. Expectations can also influence decisions about wages and prices. No single explanation fits every period.","Central banks often use interest rates as one tool to influence inflation. Higher rates can make borrowing more expensive and may reduce spending, although their effects take time and involve trade-offs. For households, understanding inflation can improve long-term planning. It is important to compare changes in income, savings returns, and prices rather than focusing on a single number."],"question":"What is purchasing power?","options":["How much goods and services money can buy","The number of coins in a wallet","The speed of an ATM"],"answer":0,"words":154},{"id":14,"title":"A Market Without Money","topic":"היסטוריה","level":"A2","body":["Before modern money became common, people in many societies exchanged goods and services in different ways. Imagine a farmer who has extra grain and wants a pair of shoes. The farmer might look for a shoemaker who needs grain. This direct exchange is often called barter.","Barter can work, especially in small communities, but it has limitations. The farmer must find someone who both has shoes and wants grain. It can also be difficult to decide how much grain is equal to one pair of shoes. Societies developed many solutions, including shared systems of credit and different forms of money.","Money makes exchange easier because people can accept it without needing the exact product they want at that moment. It can also help people compare prices and store value, although its value may change. The history of trade shows that economic systems develop as communities find new ways to cooperate."],"question":"What is one difficulty with barter?","options":["Finding someone who wants what you offer","Having too many banknotes","Using a credit card"],"answer":0,"words":150},{"id":15,"title":"How Maps Changed Travel","topic":"היסטוריה","level":"B1","body":["For much of human history, travelers depended on local knowledge, stars, landmarks, and written descriptions to find their way. Maps helped people communicate information about distance, direction, and the location of rivers, roads, and cities. Early maps varied greatly in accuracy because the tools available to their makers were limited.","As navigation and measurement improved, maps became more detailed. Sailors used charts to plan routes, while governments and merchants used maps to organize trade and transportation. Later, aerial photography and satellites provided new ways to observe the Earth.","Today, digital maps can show a person’s position and suggest a route in seconds. Yet a map is still a model of the world, not the world itself. Roads close, places change, and information can be incorrect. Good travelers combine technology with attention to their surroundings. The development of maps illustrates how better information can change what people are able to do."],"question":"Why are digital maps not always perfect?","options":["Places and roads can change","Satellites never move","Every map is drawn by hand"],"answer":0,"words":150},{"id":16,"title":"A Weekend in Kyoto","topic":"טיולים","level":"A2","body":["Nina arrived in Kyoto on a cool Friday evening. She had read about the city’s temples, gardens, and traditional streets, but she wanted to explore without rushing. On Saturday morning, she walked through a quiet neighborhood and stopped at a small café for breakfast.","Later, she visited a garden where stones, trees, and water were arranged carefully. She noticed how the paths encouraged visitors to slow down. In the afternoon, she took a bus to a busy shopping area. The city felt different there, with bright signs and crowds of people.","On Sunday, Nina joined a short cultural workshop and learned a few Japanese greetings. She made mistakes, but the teacher was patient. By the end of the trip, she realized that travel is not only about visiting famous places. It can also be about observing everyday life, listening to people, and becoming comfortable with unfamiliar situations."],"question":"What did Nina learn about travel?","options":["Everyday experiences can matter","Only famous places matter","Travel must always be fast"],"answer":0,"words":147},{"id":17,"title":"The Airport Delay","topic":"טיולים","level":"A2","body":["Omar arrived at the airport two hours before his flight. He checked his suitcase, passed through security, and found the correct gate. Then an announcement appeared on the screen: his flight was delayed because of bad weather. The new departure time was three hours later.","At first, Omar felt frustrated. He had planned to meet a friend after landing, and now his schedule would change. He sent a message explaining the delay. Then he found a quiet seat, charged his phone, and bought something to eat.","While waiting, he met another passenger who was traveling to the same city for the first time. They talked about restaurants and interesting places to visit. When boarding finally began, Omar felt calmer. He had not controlled the weather, but he had controlled his response. The experience reminded him that flexibility is a valuable travel skill."],"question":"Why was the flight delayed?","options":["Bad weather","A missing passport","A broken suitcase"],"answer":0,"words":142},{"id":18,"title":"The Mystery of the Old Photograph","topic":"חיים וסיפורים","level":"B1","body":["While cleaning her grandfather’s house, Ella found an old photograph inside a book. It showed a group of young people standing in front of a building she did not recognize. On the back, someone had written a date and the words “Our first big idea.” Ella was curious and decided to ask her grandfather about it.","He explained that the people in the picture were friends who had opened a small neighborhood library many years earlier. They collected donated books, repaired old shelves, and invited children to visit after school. The project lasted only a few years, but it helped many families discover the pleasure of reading.","Ella asked why he had never told her the story. Her grandfather smiled and said he had almost forgotten how important the project once felt. Together, they looked through more photographs and wrote down the names of the volunteers. Ella realized that history is not only found in museums. Sometimes it is waiting quietly in a drawer, ready for someone to ask a question."],"question":"What did the people in the photo create?","options":["A neighborhood library","A sports stadium","A restaurant chain"],"answer":0,"words":171},{"id":19,"title":"The Science of Sleep","topic":"מדע","level":"B1","body":["Sleep is not simply a period when the brain switches off. During sleep, the body moves through different stages, including non-REM and REM sleep. These stages are associated with different patterns of brain activity and physical changes. Researchers continue to study how sleep supports memory, learning, emotional regulation, and physical health.","Sleep needs vary with age and individual circumstances. For most adults, regularly getting enough sleep is important, but quality and consistency also matter. Light exposure, caffeine, stress, and irregular schedules can influence how easily someone falls asleep or stays asleep.","People sometimes believe they can replace lost sleep with one long night, but recovery is not always so simple. Building helpful habits, such as keeping a fairly regular schedule and making the bedroom comfortable, may improve sleep. Persistent sleep problems deserve professional attention. Understanding sleep reminds us that rest is an active biological process, not wasted time."],"question":"Which factor can affect sleep?","options":["Caffeine and light","Shoe size","The color of a notebook"],"answer":0,"words":148},{"id":20,"title":"How Electric Cars Use Energy","topic":"טכנולוגיה","level":"B1","body":["An electric car stores energy in a battery and uses an electric motor to turn its wheels. Unlike a conventional gasoline car, it does not need to burn fuel inside an engine to create movement. This can make electric motors efficient and reduce exhaust emissions from the vehicle itself.","However, the full environmental impact of a car depends on more than what happens while driving. Battery production requires materials and energy, and electricity can come from different sources. The car’s size, lifespan, and how often it is used also influence its overall impact.","Charging speed and driving range are important practical questions. Fast charging can be useful on long trips, while charging at home may be convenient for daily travel. Electric cars are one part of a broader discussion about transportation. Public transit, walking, cycling, and better city planning can also reduce the resources needed to move people."],"question":"What powers the wheels of an electric car?","options":["An electric motor","A steam boiler","A bicycle chain"],"answer":0,"words":148},{"id":21,"title":"What Makes a Good Team?","topic":"לימודים ועבודה","level":"B1","body":["A team can include talented people and still struggle to complete a project. Success depends not only on individual ability but also on communication, trust, and clear responsibilities. When everyone assumes someone else will finish a task, important work may be forgotten.","In a college project, four students were asked to design a simple website. At first, they all worked separately and made different decisions about colors and layout. Their pages did not fit together. After a difficult meeting, they agreed on shared goals, divided the work, and set short deadlines.","The website improved because the team started checking progress regularly and asking for help early. They also learned to disagree respectfully. A strong team does not need everyone to think alike. Different ideas can improve a project when people listen carefully and make decisions together. Teamwork is a skill that develops with practice."],"question":"What improved the students’ project?","options":["Shared goals and clear tasks","Avoiding all meetings","Working without communication"],"answer":0,"words":144},{"id":22,"title":"The Hidden Cost of a Cheap Product","topic":"כלכלה","level":"B1","body":["A product with a low price is not always the least expensive choice over time. Imagine two pairs of shoes. One pair costs less but wears out after a few months. The other costs more initially but lasts much longer. To compare them fairly, a buyer should consider how often each pair needs to be replaced.","Economists and businesses sometimes use the idea of total cost of ownership. This includes the purchase price and other costs such as maintenance, energy, repairs, and replacement. For example, a cheap printer may require expensive ink, while a more expensive printer may cost less to operate.","The best choice still depends on a person’s budget and needs. Someone may not have enough money to buy the more durable option today. Good financial decisions involve understanding trade-offs rather than assuming that the lowest sticker price is always the best value."],"question":"What is total cost of ownership?","options":["Purchase and ongoing costs","Only the price tag","Only the shipping date"],"answer":0,"words":145},{"id":23,"title":"Why Bridges Stay Up","topic":"מדע","level":"B1","body":["A bridge must carry its own weight as well as the weight of vehicles, people, and sometimes strong winds. Engineers study the forces acting on a bridge and choose materials and shapes that can resist them. Two important ideas are tension, which pulls materials apart, and compression, which pushes them together.","Different bridge designs manage forces in different ways. An arch bridge transfers much of its load through compression. A suspension bridge uses strong cables that carry tension. Engineers also consider the ground beneath the bridge, temperature changes, and how materials behave over many years.","Safety depends on careful design, construction, inspection, and maintenance. Even a well-designed bridge can develop problems if damage is ignored. Bridges show how mathematics and physics become practical tools. The next time you cross a river, the structure beneath you represents many decisions about forces, materials, and risk."],"question":"What force pulls materials apart?","options":["Tension","Compression","Evaporation"],"answer":0,"words":143},{"id":24,"title":"The First Computer Programs","topic":"היסטוריה","level":"B1","body":["Modern computers run programs that help people communicate, calculate, create art, and manage information. The history of programming began long before personal computers appeared in homes. Early computing ideas grew from mathematics, mechanical machines, and the need to perform complex calculations.","In the nineteenth century, Ada Lovelace wrote detailed notes about Charles Babbage’s proposed Analytical Engine. Her work included an algorithm intended for the machine, and she recognized that a computing device might manipulate symbols as well as numbers. The machine was not completed in her lifetime, but the ideas were influential.","During the twentieth century, electronic computers became faster and more practical. Programming languages made it easier to describe instructions without controlling every electrical detail. Today, a student can write a small program on a laptop and share it with people around the world. The technology has changed dramatically, but the central idea remains: a program is a set of instructions that a machine can follow."],"question":"What is a computer program?","options":["Instructions a machine can follow","A type of battery","A paper map"],"answer":0,"words":157},{"id":25,"title":"How a Small Business Grows","topic":"כלכלה","level":"B1","body":["When Sofia opened a bakery, she worked alone and sold bread to customers in her neighborhood. At first, she made only a few products because she wanted to understand what people liked. She asked customers for feedback and kept careful records of her expenses and sales.","As demand increased, Sofia hired an assistant and bought a larger oven. Growth created opportunities, but it also brought new costs. She needed more ingredients, more space, and a reliable delivery system. Selling more products did not automatically mean making more profit.","Sofia learned to compare revenue with costs and to plan for slow periods. She also discovered that quality and customer trust were important assets. Some customers returned every week because they knew what to expect. A successful small business often grows through many practical decisions, not one dramatic moment. Careful planning can be just as important as a good idea."],"question":"Why did more sales not guarantee more profit?","options":["Growth also increased costs","Bread became free","Customers stopped eating"],"answer":0,"words":148},{"id":26,"title":"The Forest After a Fire","topic":"סביבה וטבע","level":"B1","body":["A forest fire can change a landscape very quickly. Trees may burn, animals may lose shelter, and the soil can become exposed to rain and erosion. However, the long-term effects depend on the type of ecosystem, the intensity of the fire, and how frequently fires occur.","Some plant species have adapted to environments where fire happens naturally. Certain seeds may open or grow more successfully after heat or changes in sunlight. Other forests recover slowly, especially after severe or repeated fires. Human activities and climate conditions can also influence fire risk.","Scientists study burned areas to understand which plants return, how wildlife responds, and whether the soil remains healthy. Recovery is not always a simple return to the previous forest. Sometimes a different mix of species develops. The story of a forest after fire shows that ecosystems are dynamic and that protecting them requires understanding local conditions."],"question":"What affects forest recovery?","options":["Fire intensity and ecosystem type","Only the day of the week","The color of nearby houses"],"answer":0,"words":147},{"id":27,"title":"A Conversation Across Cultures","topic":"חיים וסיפורים","level":"B1","body":["At an international student event, David met a student named Aiko. They both spoke English, but neither used it as a first language. At first, David worried about making grammar mistakes. Aiko explained that she felt the same way, so they agreed to speak slowly and ask questions when something was unclear.","They talked about family meals, university life, and the differences between their hometowns. Some expressions were unfamiliar, and they occasionally laughed at misunderstandings. Instead of ending the conversation, they used simple words and examples to explain their ideas.","After an hour, David noticed that he was speaking more confidently. He had not suddenly learned every English word, but he had practiced a more important skill: communicating despite imperfect language. He realized that good conversations depend on curiosity and patience as much as grammar. The experience encouraged him to practice English with more people."],"question":"What helped David and Aiko communicate?","options":["Patience and asking questions","Speaking as fast as possible","Avoiding unfamiliar topics"],"answer":0,"words":145},{"id":28,"title":"The Problem with Too Much Information","topic":"טכנולוגיה","level":"B2","body":["People today can access more information than most previous generations could imagine. News, messages, videos, and research articles arrive continuously. Access is valuable, but abundance creates a new challenge: deciding what deserves attention. When every notification seems urgent, it becomes difficult to concentrate on complex work.","Researchers distinguish between receiving information and processing it meaningfully. Reading many headlines may create a feeling of being informed without producing deep understanding. Algorithms that recommend content can make discovery easier, but they may also encourage repeated engagement with similar ideas.","One practical response is to develop deliberate information habits. A reader might choose a small number of trustworthy sources, set aside time for focused reading, and verify surprising claims before sharing them. The goal is not to avoid technology. It is to use technology in a way that supports thoughtful decisions. In an information-rich world, attention is a resource worth protecting."],"question":"What is a key challenge of abundant information?","options":["Choosing what deserves attention","Finding any information at all","Making all notifications disappear forever"],"answer":0,"words":148},{"id":29,"title":"Why Cities Need Public Spaces","topic":"ידע כללי","level":"B2","body":["A city is more than its buildings and roads. Parks, libraries, squares, and pedestrian streets create places where residents can meet without needing to buy something. These public spaces can support exercise, cultural activities, social connections, and a sense of belonging.","Design matters. A park may be beautiful but difficult to reach if busy roads surround it. A square may be large but uncomfortable without shade or places to sit. Planners must consider accessibility, safety, maintenance, and the different needs of children, older adults, and people with disabilities.","Public spaces also involve trade-offs. Land is limited, and cities must decide how to balance housing, transport, businesses, and green areas. Successful planning often requires listening to local communities rather than assuming one design will work everywhere. When public spaces are welcoming and well maintained, they can improve everyday life in ways that are difficult to measure with money alone."],"question":"What makes public space useful?","options":["Accessibility and thoughtful design","Only expensive buildings","Keeping people away"],"answer":0,"words":148},{"id":30,"title":"How Scientific Ideas Change","topic":"מדע","level":"B2","body":["Science develops through observation, measurement, testing, and criticism. A scientific explanation is useful when it makes sense of evidence and can be examined by others. However, scientific knowledge is not a collection of statements that can never change. New instruments, better experiments, or unexpected results may lead researchers to revise earlier conclusions.","This process can look confusing from the outside. People may wonder why experts disagree or why recommendations change. Sometimes disagreement reflects genuine uncertainty, differences in methods, or the arrival of new evidence. Responsible researchers explain what is known, what remains uncertain, and how confident they are in a conclusion.","Changing an explanation does not necessarily mean that earlier research was worthless. Often, a new theory builds on previous discoveries while describing a wider range of situations more accurately. Learning how science works encourages curiosity and careful thinking. It also helps us distinguish strong evidence from confident-sounding claims that have not been properly tested."],"question":"Why can scientific explanations change?","options":["New evidence and better methods","Scientists dislike facts","Every experiment is identical"],"answer":0,"words":155},{"id":31,"title":"The Economics of Renewable Energy","topic":"כלכלה","level":"B2","body":["Solar panels and wind turbines produce electricity without burning fuel during operation. Their costs have changed significantly as manufacturing and technology have improved. However, comparing energy systems requires more than looking at the price of one machine. Analysts consider construction, maintenance, financing, transmission, storage, and the reliability of supply.","Electricity demand changes throughout the day, while wind and sunlight vary with weather and season. A power system therefore needs ways to balance production and consumption. These may include energy storage, flexible demand, stronger grids, and other sources of generation. The best combination depends on geography, infrastructure, and policy.","Investment decisions also involve uncertainty. Equipment can last for decades, but future fuel prices, regulations, and technological advances are difficult to predict. Renewable energy is both an engineering challenge and an economic one. Understanding its costs and benefits requires considering the entire system rather than a single headline about cheap electricity."],"question":"Why is energy storage useful?","options":["Wind and sunlight vary over time","Solar panels work only underground","Electricity cannot travel"],"answer":0,"words":149},{"id":32,"title":"The Science of Better Sleep","topic":"מדע","level":"A2","body":["Sleep is not simply a time when the brain turns off. While we sleep, the brain remains active. It organizes memories, processes emotions, and helps the body recover. Scientists describe several stages of sleep. Some stages are important for physical recovery, while others are connected to dreaming and learning. Most adults need about seven to nine hours of sleep, although individual needs can differ.","Light, noise, and daily habits can influence sleep quality. Bright screens late at night may make it harder to feel sleepy because light can affect the body’s internal clock. Caffeine can also stay in the body for several hours. A regular bedtime, a quiet room, and morning daylight may help people develop a healthier routine. Exercise is useful too, but intense activity immediately before bed does not work well for everyone.","Imagine two students preparing for the same examination. One studies until three in the morning and sleeps for four hours. The other studies earlier and gets a full night of rest. The second student may remember more information, even after spending less time studying. Sleep cannot replace practice, but it supports the learning process. Good sleep is not a luxury; it is one of the foundations of health and effective study.","If you want to improve your sleep, change one habit at a time. Try keeping a consistent waking time for a week and notice how you feel. Do not expect one perfect night to solve everything. The goal is a pattern that is realistic and sustainable."],"question":"What does the brain do during sleep?","options":["It organizes memories","It stops working completely","It forgets all information"],"answer":0,"extraQuestions":[{"question":"Which habit may help sleep?","options":["Drinking coffee at midnight","Keeping a regular bedtime","Using bright screens all night"],"answer":1},{"question":"What is the main message?","options":["Sleep supports learning and health","Sleep replaces studying","Everyone needs exactly nine hours"],"answer":0}],"words":252},{"id":33,"title":"How Online Payments Work","topic":"טכנולוגיה","level":"B1","body":["When you buy something online, the payment may appear to happen instantly. Behind the screen, however, several organizations communicate with one another. The website sends payment information to a payment processor. The processor communicates with the card network and the bank that issued the customer’s card. These systems check whether the transaction can be approved.","The bank may examine the available balance, the card status, and signals that suggest possible fraud. If the payment is approved, the store receives a message confirming the authorization. Authorization is not always the same as the final transfer of money. Settlement, when funds actually move between financial institutions, can happen later. This is one reason why a purchase may appear as pending in a banking application.","Security is essential because payment information is sensitive. Many websites use encryption to protect data during transmission. Some systems replace card details with a token, which is a different value that is less useful to a criminal if stolen. Additional checks, such as a one-time code or biometric approval, can reduce risk. Still, no payment system is completely free from fraud.","Consumers can protect themselves by using trusted websites, checking statements, and avoiding suspicious links. Businesses must also balance convenience with security. A payment process that is too complicated may cause customers to leave, while a process that is too simple may create unnecessary risk. Modern payments are a practical example of technology, finance, and human behavior working together."],"question":"What happens before a payment is approved?","options":["The bank may check fraud signals","The store always receives cash","The card is destroyed"],"answer":0,"extraQuestions":[{"question":"What does settlement refer to?","options":["Moving funds between institutions","Choosing a password","Designing a website"],"answer":0},{"question":"Why are tokens useful?","options":["They replace sensitive card details","They make all fraud impossible","They are physical coins"],"answer":0}],"words":241},{"id":34,"title":"Why Cities Need Trees","topic":"מדע","level":"A2","body":["Trees make a city more pleasant, but their benefits go far beyond appearance. On hot days, leaves provide shade and reduce the amount of sunlight reaching streets and buildings. Trees also release water vapor into the air, which can help cool the surrounding area. In neighborhoods with little shade, walking outside may become uncomfortable or even dangerous during extreme heat.","Trees support wildlife by providing food and shelter for birds and insects. Their roots can help soil absorb rainwater, reducing some pressure on drainage systems during storms. Urban trees can also improve how a street feels to residents. A shaded sidewalk may encourage walking, while a small park can offer a place for neighbors to meet and relax.","Planting a tree is not enough by itself. Young trees need water, suitable soil, and protection from damage. Different species have different requirements. A tree that grows well in one climate may struggle in another. City planners must also consider sidewalks, underground pipes, and power lines. Choosing the right tree for the right place is an important part of urban planning.","Communities can help by caring for existing trees and supporting long-term maintenance. The benefits of a large tree often take many years to develop. That is why protecting healthy mature trees can be as important as planting new ones. A greener city is not created in a single weekend; it requires patient planning and care."],"question":"How can trees cool streets?","options":["By providing shade","By producing electricity","By removing every building"],"answer":0,"extraQuestions":[{"question":"What do young trees need?","options":["Water and suitable soil","Only paint","No care at all"],"answer":0},{"question":"Why protect mature trees?","options":["Their benefits take years to develop","They never need water","They stop all storms"],"answer":0}],"words":234},{"id":35,"title":"Understanding Inflation","topic":"כלכלה","level":"B1","body":["Inflation means that the general level of prices in an economy rises over time. It does not mean that every product becomes more expensive at exactly the same rate. Some prices may increase quickly, others may remain stable, and a few may even fall. Economists often measure inflation by following the cost of a basket of goods and services that households commonly purchase.","Imagine that a basket of everyday products costs one hundred dollars this year. If the same basket costs one hundred and five dollars next year, its price has risen by five percent. If your income stays the same, you may be able to buy less than before. This is called a loss of purchasing power. However, wages, savings returns, and different household spending patterns can change the experience of inflation.","Inflation can have several causes. Strong demand may push prices higher when businesses cannot increase supply quickly enough. Production costs, such as energy and transportation, may also rise. Central banks often use interest rates to influence borrowing and spending. Higher rates can reduce demand, but they may also slow economic activity. These decisions involve difficult trade-offs.","For an individual, understanding inflation is useful when planning a budget or comparing investments. A savings account that earns three percent while prices rise by four percent has a negative real return before taxes and fees. The important question is not only how much money you have, but what that money can buy in the future."],"question":"What is inflation?","options":["A rise in the general price level","A fall in every price","A type of bank account"],"answer":0,"extraQuestions":[{"question":"What is purchasing power?","options":["What money can buy","The number of banks","The color of banknotes"],"answer":0},{"question":"Why might central banks raise rates?","options":["To influence demand","To stop all production","To remove taxes"],"answer":0}],"words":245},{"id":36,"title":"The History of the Bicycle","topic":"היסטוריה","level":"A2","body":["The bicycle seems simple today, but it developed through many experiments. Early two-wheeled machines did not have pedals. Riders pushed themselves forward with their feet. Later inventors added pedals, chains, and better wheels. Some nineteenth-century bicycles had a very large front wheel and a much smaller back wheel. They could move quickly, but falling from them was dangerous.","The modern safety bicycle became popular because it was easier to control. Its wheels were similar in size, and a chain transferred power from the pedals to the rear wheel. Improvements in tires made riding more comfortable. As factories produced bicycles in larger numbers, more people could afford them. The bicycle changed the way many people traveled to work, visited friends, and explored their surroundings.","Bicycles also influenced society. They offered a relatively inexpensive form of independent transportation and helped expand opportunities for personal mobility. Over time, cycling became both a practical activity and a sport. Cities began creating special paths, although the quality and safety of cycling infrastructure still vary greatly around the world.","Today, electric bicycles make longer journeys and steep hills easier for some riders. Yet the central idea remains familiar: a person balances on two wheels and moves forward using a compact machine. The bicycle shows how a useful invention can improve gradually through many small changes rather than one dramatic discovery."],"question":"What did early two-wheeled machines lack?","options":["Pedals","Wheels","Riders"],"answer":0,"extraQuestions":[{"question":"Why was the safety bicycle popular?","options":["It was easier to control","It had no wheels","It could fly"],"answer":0},{"question":"What is the main theme?","options":["An invention improved over time","A single inventor did everything","Bicycles disappeared"],"answer":0}],"words":224},{"id":37,"title":"A Weekend Without a Phone","topic":"חיים וסיפורים","level":"A2","body":["Maya noticed that she checked her phone whenever she had a free moment. She opened messages while eating breakfast and watched short videos before going to sleep. One Friday, she decided to try an experiment: she would spend most of the weekend without social media. She told her friends that they could call her if something was urgent.","On Saturday morning, Maya felt uncomfortable. She wanted to reach for her phone while waiting for the kettle to boil. Instead, she made tea and sat near the window. Later she visited a local market, spoke with a shop owner, and bought fresh bread. The afternoon seemed longer than usual, but not in a bad way. She had time to finish a book she had started months earlier.","By Sunday, Maya understood that the phone itself was not the problem. She used it for maps, music, and staying connected with people she cared about. The problem was her habit of opening applications without deciding why. She did not want to stop using technology. She wanted to use it more deliberately.","On Monday, she turned off several unnecessary notifications and moved social media applications away from her home screen. Her experiment did not change her life overnight. Still, it helped her notice how she spent her attention. Sometimes a small break is enough to reveal a habit that has become invisible."],"question":"Why did Maya try the experiment?","options":["She checked her phone too often","Her phone was broken","She wanted to buy a new phone"],"answer":0,"extraQuestions":[{"question":"What did she do at the market?","options":["Spoke with a shop owner","Bought a television","Lost her keys"],"answer":0},{"question":"What did she learn?","options":["Use technology more deliberately","Never use maps again","Phones have no benefits"],"answer":0}],"words":228},{"id":38,"title":"What Makes a Good Investment Plan?","topic":"כלכלה","level":"B1","body":["An investment plan begins with a goal. Someone saving for a vacation next year has different needs from someone saving for retirement in thirty years. Time matters because investments can rise and fall, sometimes sharply. Money that will be needed soon generally requires a different approach from money that can remain invested for a long period.","Risk and return are connected, but not in a simple or guaranteed way. An investment with the possibility of high returns may also have a significant chance of loss. Diversification means spreading money across different investments instead of depending on one company or industry. It can reduce certain risks, but it cannot eliminate the possibility that markets fall together.","Costs deserve attention. Management fees, transaction charges, and taxes can reduce the amount an investor keeps. Even small annual fees may have a meaningful effect over many years. It is also important to distinguish between a good investment and an investment that recently increased in price. Past performance does not guarantee future results.","A realistic plan includes regular contributions, an emergency reserve, and rules for handling market declines. Investors should understand what they own and why they own it. The purpose of a plan is not to predict every market movement. It is to make decisions that remain sensible even when emotions are strong and the future is uncertain."],"question":"Why does investment time matter?","options":["Short and long goals have different needs","Markets never fall","All investments are identical"],"answer":0,"extraQuestions":[{"question":"What does diversification do?","options":["Spreads exposure across investments","Guarantees profits","Removes every risk"],"answer":0},{"question":"What can reduce long-term returns?","options":["Fees and taxes","Only sunny weather","Reading books"],"answer":0}],"words":224},{"id":39,"title":"How Artificial Intelligence Learns","topic":"טכנולוגיה","level":"B2","body":["Artificial intelligence is a broad field, but many modern systems learn patterns from data. Instead of writing a separate rule for every possible situation, developers train a model using examples. During training, the model adjusts internal numerical values so that its predictions better match the training information. This process can require substantial computing power and careful evaluation.","Consider an application designed to recognize photographs of cats and dogs. Developers might show it many labeled images. The system learns statistical relationships between image features and labels. However, a model that performs well on familiar training examples may still struggle with unusual lighting, unfamiliar breeds, or misleading backgrounds. Testing on new data helps reveal whether the model generalizes.","Language models operate on a different kind of information, but the idea of learning patterns remains important. They can generate fluent text, summarize documents, and answer questions. Fluency, however, is not proof of accuracy. A model may produce an answer that sounds confident while containing incorrect facts. For this reason, critical decisions require verification and appropriate human oversight.","AI systems also raise questions about privacy, fairness, energy use, and responsibility. Useful applications depend not only on sophisticated algorithms but also on clear goals and thoughtful design. Understanding both the strengths and limitations of AI helps people use these tools more effectively, rather than treating them as either magical or worthless."],"question":"How do many AI models learn?","options":["By adjusting values using examples","By reading minds","By avoiding all data"],"answer":0,"extraQuestions":[{"question":"Why test on new data?","options":["To check generalization","To remove electricity","To make the model older"],"answer":0},{"question":"Does fluent text guarantee accuracy?","options":["No","Yes, always","Only on weekends"],"answer":0}],"words":226}],"grammar":[{"id":1,"title":"To Be — am / is / are","level":"A1","explanation":"לתיאור מצב, זהות ותכונה משתמשים ב־am/is/are. עם I משתמשים ב־am; עם he/she/it ב־is; ועם you/we/they ב־are. בשאלה מעבירים את הפועל לפני הנושא.","examples":["I am ready.","She is a student.","Are they tired?"],"questions":[{"question":"She ___ a student.","options":["is","am","are"],"answer":0},{"question":"We ___ at home.","options":["are","is","am"],"answer":0},{"question":"___ you ready?","options":["Are","Is","Am"],"answer":0},{"question":"I ___ happy.","options":["am","are","is"],"answer":0},{"question":"It ___ cold today.","options":["is","are","am"],"answer":0},{"question":"My friends ___ happy.","options":["are","is","am"],"answer":0},{"question":"I ___ from Israel.","options":["am","is","are"],"answer":0},{"question":"The book ___ on the table.","options":["is","are","am"],"answer":0},{"question":"___ he your brother?","options":["Is","Are","Am"],"answer":0},{"question":"They ___ not late.","options":["are","is","am"],"answer":0}]},{"id":2,"title":"Present Simple — positive","level":"A1","explanation":"זמן הווה פשוט מתאר הרגלים ועובדות. עם I/you/we/they הפועל בצורת הבסיס. עם he/she/it מוסיפים בדרך כלל s או es, ולעיתים ies.","examples":["I work every day.","She works on Monday.","He studies English."],"questions":[{"question":"She ___ English.","options":["studies","study","studying"],"answer":0},{"question":"They ___ in a city.","options":["live","lives","living"],"answer":0},{"question":"He ___ coffee.","options":["drinks","drink","drinking"],"answer":0},{"question":"I ___ every morning.","options":["walk","walks","walking"],"answer":0},{"question":"The bus ___ at eight.","options":["arrives","arrive","arriving"],"answer":0},{"question":"She ___ coffee every morning.","options":["drinks","drink","drinking"],"answer":0},{"question":"I ___ English on Sundays.","options":["study","studies","studying"],"answer":0},{"question":"Does he ___ here?","options":["work","works","working"],"answer":0},{"question":"They ___ not eat meat.","options":["do","does","is"],"answer":0},{"question":"The sun ___ in the east.","options":["rises","rise","rising"],"answer":0}]},{"id":3,"title":"Present Simple — negatives","level":"A1","explanation":"בשלילה משתמשים ב־do not / don’t עם I/you/we/they, וב־does not / doesn’t עם he/she/it. אחרי does הפועל חוזר לצורת הבסיס.","examples":["I do not eat meat.","She does not drive.","They don’t work today."],"questions":[{"question":"He ___ like tea.","options":["doesn’t","don’t","isn’t"],"answer":0},{"question":"We ___ work on Sunday.","options":["don’t","doesn’t","aren’t"],"answer":0},{"question":"She doesn’t ___ here.","options":["live","lives","living"],"answer":0},{"question":"I ___ know.","options":["don’t","doesn’t","am not"],"answer":0},{"question":"They ___ need help.","options":["don’t","doesn’t","isn’t"],"answer":0}]},{"id":4,"title":"Present Simple — questions","level":"A1","explanation":"לשאלות כן/לא מתחילים ב־Do או Does, אחר כך הנושא ופועל הבסיס. לשאלות מידע מוסיפים מילת שאלה כמו Where או Why.","examples":["Do you study?","Does she work?","Where do they live?"],"questions":[{"question":"___ you speak English?","options":["Do","Does","Are"],"answer":0},{"question":"___ he play football?","options":["Does","Do","Is"],"answer":0},{"question":"Where ___ she live?","options":["does","do","is"],"answer":0},{"question":"Does she ___ here?","options":["work","works","working"],"answer":0},{"question":"Why ___ they study?","options":["do","does","are"],"answer":0}]},{"id":5,"title":"There is / There are","level":"A1","explanation":"משתמשים ב־There is לדבר יחיד וב־There are לדבר ברבים. בשאלה הופכים את הסדר: Is there...? / Are there...?","examples":["There is a book.","There are two chairs.","Is there a station nearby?"],"questions":[{"question":"There ___ a park.","options":["is","are","am"],"answer":0},{"question":"There ___ three buses.","options":["are","is","be"],"answer":0},{"question":"___ there a café?","options":["Is","Are","Do"],"answer":0},{"question":"There ___ many people.","options":["are","is","has"],"answer":0},{"question":"___ there any questions?","options":["Are","Is","Does"],"answer":0}]},{"id":6,"title":"Past Simple — regular","level":"A2","explanation":"עבר פשוט מתאר פעולה שהסתיימה בעבר. בפעלים רגילים מוסיפים ed; לפעמים רק d, ובמקרים מסוימים משנים y ל־ied.","examples":["I worked yesterday.","She studied last night.","We visited a museum."],"questions":[{"question":"Yesterday I ___ at home.","options":["worked","work","working"],"answer":0},{"question":"She ___ for the test.","options":["studied","study","studies"],"answer":0},{"question":"They ___ the city.","options":["visited","visit","visiting"],"answer":0},{"question":"He ___ the door.","options":["opened","open","opens"],"answer":0},{"question":"We ___ the movie.","options":["enjoyed","enjoy","enjoying"],"answer":0}]},{"id":7,"title":"Past Simple — irregular","level":"A2","explanation":"לפעלים לא רגילים יש צורת עבר מיוחדת שצריך ללמוד: go→went, see→saw, buy→bought, eat→ate, take→took.","examples":["I went to school.","She bought a book.","They saw a movie."],"questions":[{"question":"I ___ to the market.","options":["went","goed","go"],"answer":0},{"question":"She ___ a ticket.","options":["bought","buyed","buy"],"answer":0},{"question":"We ___ breakfast.","options":["ate","eated","eat"],"answer":0},{"question":"He ___ a photo.","options":["took","taked","take"],"answer":0},{"question":"They ___ the game.","options":["saw","seed","see"],"answer":0}]},{"id":8,"title":"Future — will / going to","level":"A2","explanation":"Will משמש להחלטות ספונטניות, הבטחות או תחזיות. Be going to נפוץ לתוכניות וכוונות קיימות. שתיהן מתייחסות לעתיד אך אינן תמיד זהות.","examples":["I will help you.","I am going to study tonight.","It will probably rain."],"questions":[{"question":"I think it ___ rain.","options":["will","is","did"],"answer":0},{"question":"She is going ___ travel.","options":["to","for","at"],"answer":0},{"question":"We ___ going to cook.","options":["are","is","am"],"answer":0},{"question":"I ___ call you later.","options":["will","was","do"],"answer":0},{"question":"He is going to ___ English.","options":["learn","learns","learned"],"answer":0}]},{"id":9,"title":"Present Continuous","level":"A2","explanation":"משתמשים ב־am/is/are + פועל עם ing לפעולות שקורות כעת ולפעמים לתוכניות קרובות.","examples":["I am reading now.","She is studying.","They are working."],"questions":[{"question":"She is ___ now.","options":["reading","read","reads"],"answer":0},{"question":"We ___ listening.","options":["are","is","am"],"answer":0},{"question":"I am ___ dinner.","options":["cooking","cook","cooks"],"answer":0},{"question":"They are ___ football.","options":["playing","play","plays"],"answer":0},{"question":"He ___ working today.","options":["is","are","am"],"answer":0}]},{"id":10,"title":"Comparatives and superlatives","level":"A2","explanation":"משווים בין שני דברים באמצעות comparative: bigger / more interesting. כשמשווים בתוך קבוצה משתמשים ב־superlative: the biggest / the most interesting.","examples":["This road is longer.","This is the longest road.","Science is more interesting to me."],"questions":[{"question":"This bag is ___ than mine.","options":["heavier","heaviest","heavy"],"answer":0},{"question":"It is the ___ day.","options":["coldest","colder","cold"],"answer":0},{"question":"This book is ___ interesting.","options":["more","most","many"],"answer":0},{"question":"She is ___ than her brother.","options":["taller","tallest","tall"],"answer":0},{"question":"It is the ___ useful tool.","options":["most","more","much"],"answer":0}]},{"id":11,"title":"Present Perfect","level":"B1","explanation":"הווה מושלם: have/has + צורת הפועל השלישית. משתמשים בו בין היתר לניסיון חיים או לפעולה מהעבר עם קשר להווה.","examples":["I have visited London.","She has finished her work.","Have you ever tried sushi?"],"questions":[{"question":"She ___ finished.","options":["has","have","is"],"answer":0},{"question":"I have ___ this film.","options":["seen","saw","see"],"answer":0},{"question":"They ___ arrived.","options":["have","has","are"],"answer":0},{"question":"Have you ever ___ abroad?","options":["traveled","travel","traveling"],"answer":0},{"question":"He has ___ his keys.","options":["lost","lose","losing"],"answer":0}]},{"id":12,"title":"First Conditional","level":"B1","explanation":"תנאי ראשון מתאר אפשרות ממשית בעתיד: If + Present Simple, will + פועל בסיס. אין משתמשים בדרך כלל ב־will בתוך חלק ה־if.","examples":["If it rains, I will stay home.","If you practice, you will improve."],"questions":[{"question":"If I study, I ___ pass.","options":["will","would","am"],"answer":0},{"question":"If it ___, we will wait.","options":["rains","will rain","rained"],"answer":0},{"question":"She will call if she ___ time.","options":["has","will have","had"],"answer":0},{"question":"If you work hard, you ___ improve.","options":["will","would","were"],"answer":0},{"question":"If they ___ early, they will find seats.","options":["arrive","arrived","will arrive"],"answer":0}]},{"id":13,"title":"Passive Voice — basics","level":"B1","explanation":"בסביל הדגש הוא על הפעולה או על הדבר שמושפע ממנה: be + past participle. למשל: The bridge was built in 1990.","examples":["The book was written in English.","The roads are cleaned daily."],"questions":[{"question":"The bridge was ___ in 1990.","options":["built","build","building"],"answer":0},{"question":"The letters are ___ every day.","options":["sent","send","sending"],"answer":0},{"question":"The window was ___.","options":["broken","broke","break"],"answer":0},{"question":"The food is ___ here.","options":["prepared","prepare","preparing"],"answer":0},{"question":"The project was ___ last year.","options":["completed","complete","completing"],"answer":0}]},{"id":14,"title":"Modal verbs — should / must / can","level":"A2","explanation":"פעלי עזר מודאליים באים לפני פועל בסיס ללא to. Can מציין יכולת/אפשרות, should המלצה, ו־must חובה חזקה.","examples":["You should sleep.","I can swim.","You must wear a seat belt."],"questions":[{"question":"You ___ study regularly.","options":["should","should to","shoulds"],"answer":0},{"question":"She can ___ English.","options":["speak","speaks","speaking"],"answer":0},{"question":"Drivers must ___ carefully.","options":["drive","drives","driving"],"answer":0},{"question":"You should ___ water.","options":["drink","drinks","drinking"],"answer":0},{"question":"I can ___ you.","options":["help","helps","helping"],"answer":0}]},{"id":15,"title":"Articles — a / an / the","level":"A1","explanation":"A/An מתארים בדרך כלל שם עצם יחיד לא מוגדר. An בא לפני צליל תנועה, ו־the כשמדובר בדבר מסוים או מוכר בהקשר.","examples":["I saw a dog.","She ate an apple.","The dog was friendly."],"questions":[{"question":"I need ___ umbrella.","options":["an","a","the"],"answer":0},{"question":"He bought ___ book.","options":["a","an","any"],"answer":0},{"question":"___ sun is bright.","options":["The","A","An"],"answer":0},{"question":"She is ___ engineer.","options":["an","a","the"],"answer":0},{"question":"I saw ___ bird in the garden.","options":["a","an","any"],"answer":0}]},{"id":16,"title":"Prepositions — time and place","level":"A2","explanation":"At לשעה או נקודה, on ליום או למשטח, in לחודש/שנה/חלל. יש חריגים וביטויים שצריך ללמוד דרך דוגמאות.","examples":["At seven o’clock.","On Monday.","In October.","The keys are on the table."],"questions":[{"question":"We meet ___ Monday.","options":["on","in","at"],"answer":0},{"question":"The lesson starts ___ nine.","options":["at","on","in"],"answer":0},{"question":"I was born ___ 2001.","options":["in","on","at"],"answer":0},{"question":"The book is ___ the table.","options":["on","in","at"],"answer":0},{"question":"She lives ___ Israel.","options":["in","on","at"],"answer":0}]},{"id":17,"title":"Countable and Uncountable Nouns","level":"A2","explanation":"שמות עצם ספירים (apples, books) אפשר לספור, ושמות עצם בלתי ספירים (water, advice, information) אינם מקבלים בדרך כלל צורת רבים. משתמשים ב־many עם ספירים וב־much עם בלתי ספירים; a few עם ספירים ו־a little עם בלתי ספירים.","examples":["I have three apples.","How much water do you need?","There is a little milk left."],"questions":[{"question":"How ___ water is there?","options":["much","many","few"],"answer":0},{"question":"How ___ books do you have?","options":["many","much","little"],"answer":0},{"question":"I need some ___.","options":["information","informations","an information"],"answer":0},{"question":"There are ___ chairs in the room.","options":["a few","a little","much"],"answer":0},{"question":"She drinks ___ coffee.","options":["a little","a few","many"],"answer":0},{"question":"We bought two ___.","options":["apples","rice","water"],"answer":0},{"question":"There isn’t ___ milk.","options":["much","many","few"],"answer":0},{"question":"He gave me useful ___.","options":["advice","advices","an advice"],"answer":0}]},{"id":18,"title":"Comparatives and Superlatives","level":"A2","explanation":"להשוואה בין שני דברים משתמשים ב־comparative: bigger, more interesting. להשוואה בתוך קבוצה משתמשים ב־superlative: the biggest, the most interesting. שים לב לצורות חריגות: good → better → best; bad → worse → worst.","examples":["This book is cheaper than that one.","She is the tallest student.","Today is better than yesterday."],"questions":[{"question":"This road is ___ than that road.","options":["longer","longest","more long"],"answer":0},{"question":"This is ___ movie I have seen.","options":["the best","better","gooder"],"answer":0},{"question":"My bag is ___ than yours.","options":["heavier","heaviest","more heavy"],"answer":0},{"question":"English is ___ than I expected.","options":["more interesting","interestinger","most interesting"],"answer":0},{"question":"She is ___ person in our class.","options":["the youngest","younger","young"],"answer":0},{"question":"Today is ___ than Monday.","options":["worse","worst","badder"],"answer":0},{"question":"This phone is ___ expensive than that one.","options":["less","least","little"],"answer":0},{"question":"Mount Everest is ___ mountain above sea level.","options":["the highest","higher","high"],"answer":0}]},{"id":19,"title":"Modal Verbs — can, should, must","level":"A2","explanation":"פעלים מודאליים מבטאים יכולת, המלצה וחובה. can = יכול; should = כדאי / צריך כהמלצה; must = חייב. אחריהם משתמשים בפועל בצורת הבסיס, בלי to ובלי s.","examples":["I can swim.","You should rest.","You must wear a seat belt."],"questions":[{"question":"She can ___ English.","options":["speak","speaks","speaking"],"answer":0},{"question":"You ___ drink water if you are thirsty.","options":["should","can to","must to"],"answer":0},{"question":"Drivers ___ stop at a red light.","options":["must","must to","musts"],"answer":0},{"question":"He ___ play the piano very well.","options":["can","cans","can to"],"answer":0},{"question":"You should ___ earlier.","options":["sleep","sleeps","sleeping"],"answer":0},{"question":"___ you help me?","options":["Can","Do can","Are can"],"answer":0},{"question":"We must ___ careful.","options":["be","are","being"],"answer":0},{"question":"You ___ not park here; it is prohibited.","options":["must","should to","can to"],"answer":0}]},{"id":20,"title":"First Conditional","level":"B1","explanation":"במשפט תנאי ראשון מתארים מצב אפשרי בעתיד: If + Present Simple, will + base verb. בחלק של if לא משתמשים בדרך כלל ב־will. אפשר גם להפוך את סדר החלקים.","examples":["If it rains, we will stay home.","I will call you if I finish early."],"questions":[{"question":"If I study, I ___ pass.","options":["will","would","am"],"answer":0},{"question":"If it ___, we will cancel the trip.","options":["rains","will rain","raining"],"answer":0},{"question":"She will be happy if you ___ her.","options":["call","will call","called"],"answer":0},{"question":"If they leave now, they ___ arrive early.","options":["will","would","were"],"answer":0},{"question":"If he ___ hard, he will improve.","options":["works","will work","working"],"answer":0},{"question":"I will cook if you ___ the dishes.","options":["wash","will wash","washed"],"answer":0}, function contextualMeaning(word,sentence){
 const entries=verifiedContext[word.toLowerCase()]||[];
 const hit=entries.find(([rx])=>rx.test(sentence));
 return hit?hit[1]:null;
}
async function showWord(w){
 ++translationRequest;
 const clicked=w.toLowerCase();
 const sentence=wordSentence(w);
 const verified=contextualMeaning(clicked,sentence);
 const lookup=baseWord(w);
 selectedWord=lookup;
 // User corrections are displayed first; older automatically translated entries are
 // intentionally ignored because they may contain incorrect meanings.
 const personal=state.customWords[clicked]||state.customWords[lookup];
 const curated=verifiedBasic[clicked]||verifiedBasic[lookup];
 const local=expandedGlossary[clicked]||DATA.words[clicked]||supplementalGlossary[clicked]||expandedGlossary[lookup]||DATA.words[lookup]||supplementalGlossary[lookup];
 const tr=personal||verified||curated||local;
 const source=personal?'· תרגום אישי':verified?'· נבדק בהקשר':curated?'· מילון מורחב':local?'· מילון מובנה (ייתכנו משמעויות נוספות)':'· לא אומת';
 const box=$('#wordbox');
 box.classList.remove('hidden');
 box.innerHTML=translationUI(w,tr||'אין עדיין תרגום מאומת למילה הזאת.',source);
 bindWordButtons(w);
 if(!tr){
   translationManual(w,'לא נציג תרגום שלא אומת כראוי. אפשר להזין פירוש אישי, או לבדוק במילון מקצועי.');
 }else{

}

function answerQuestion(el,correct){const id=el.dataset.qid,buttons=[...document.querySelectorAll('[data-qid="'+id+'"]')];if(buttons.every(b=>b.disabled))return;const selected=+el.dataset.qi;buttons.forEach(b=>{b.disabled=true;if(+b.dataset.qi===correct)b.classList.add('correct');else if(b===el)b.classList.add('wrong')});const ok=selected===correct;$('#feedback-'+id).textContent=ok?'✓ תשובה נכונה!':'✗ לא בדיוק. התשובה הנכונה מסומנת בירוק.';state.attempts++;if(ok)state.correct++;el.classList.add('selected-answer');if(id.startsWith('listen-')){const n=+id.split('-')[1];if(!state.listenDone.includes(n))state.listenDone.push(n)}save()}
function markGrammar(id){if(!state.grammarDone.includes(id)){state.grammarDone.push(id);state.grammarDates[id]=new Date().toLocaleDateString('he-IL')}else{state.grammarDone=state.grammarDone.filter(x=>x!==id);delete state.grammarDates[id]}save();renderGrammar()}
const GRAMMAR_GUIDES={"1": {"pattern": "I am / You are / He is", "tip": "משתמשים ב־am עם I, ב־is עם he/she/it וב־are עם you/we/they. בשלילה מוסיפים not; בשאלה מעבירים את הפועל לתחילת המשפט.", "example": "She is ready. → Is she ready?"}, "2": {"pattern": "Subject + verb (s/es)", "tip": "בהווה פשוט מתארים הרגלים ועובדות. עם he/she/it מוסיפים בדרך כלל s או es לפועל.", "example": "He works every day. / They work every day."}, "3": {"pattern": "do not / does not + base verb", "tip": "בשלילה משתמשים ב־don’t עם I/you/we/they וב־doesn’t עם he/she/it. אחרי doesn’t הפועל חוזר לצורת הבסיס.", "example": "She doesn’t work. (לא works)"}, "4": {"pattern": "Do / Does + subject + base verb?", "tip": "בשאלות בהווה פשוט מתחילים ב־Do או Does. עם he/she/it משתמשים ב־Does, אבל הפועל נשאר בצורת הבסיס.", "example": "Does he study English?"}, "5": {"pattern": "There is / There are", "tip": "There is מתאים ליחיד; There are לרבים. בשאלות: Is there…? / Are there…?", "example": "There are two books on the table."}, "6": {"pattern": "verb + ed", "tip": "עבר פשוט מתאר פעולה שהסתיימה בעבר. ברוב הפעלים הרגילים מוסיפים ed. בשלילה ובשאלה משתמשים ב־did עם פועל בסיס.", "example": "I visited yesterday. / Did you visit?"}, "7": {"pattern": "irregular past forms", "tip": "לפעלים לא רגילים יש צורת עבר מיוחדת, למשל go→went. אחרי did חוזרים לצורת הבסיס.", "example": "She went home. / Did she go home?"}, "8": {"pattern": "will + verb / be going to + verb", "tip": "Will משמש לעיתים להחלטה מיידית או תחזית; going to לתוכנית או כוונה קיימת. בשני המקרים הפועל נשאר בסיסי.", "example": "I will help. / I am going to study."}, "9": {"pattern": "am / is / are + verb-ing", "tip": "הווה ממושך מתאר פעולה שמתרחשת עכשיו או מצב זמני. משתמשים בפועל be ובצורת ing.", "example": "They are studying now."}, "10": {"pattern": "adjective + er / the + est", "tip": "בהשוואה בין שני דברים משתמשים לרוב ב־er או more; לציון העליון ב־est או most. יש צורות חריגות כגון good→better→best.", "example": "This book is better than that one."}, "11": {"pattern": "have / has + past participle", "tip": "Present Perfect מקשר בין עבר להווה: ניסיון, תוצאה או פעולה שהחלה בעבר ונמשכת. עם he/she/it משתמשים ב־has.", "example": "I have finished my homework."}, "12": {"pattern": "If + present, will + verb", "tip": "בתנאי ראשון מדברים על אפשרות אמיתית בעתיד. בחלק של if משתמשים בהווה פשוט, לא ב־will.", "example": "If it rains, I will stay home."}, "13": {"pattern": "be + past participle", "tip": "בסביל מדגישים את הפעולה או את הדבר שעליו היא נעשית. זמן הפועל be משתנה לפי הזמן.", "example": "The letter was sent yesterday."}, "14": {"pattern": "modal + base verb", "tip": "אחרי can, should, must בא פועל בצורת הבסיס ללא to. Can ליכולת, should לעצה, must לחובה.", "example": "You should drink water."}, "15": {"pattern": "a / an / the", "tip": "A ו־an מציגים דבר לא מסוים; an לפני צליל תנועה. The מצביע על דבר מסוים או מוכר.", "example": "I saw a dog. The dog was friendly."}, "16": {"pattern": "in / on / at", "tip": "At לשעה או נקודה; on לימים ולמשטחים; in לחודשים, שנים, חללים ותקופות. יש ביטויים חריגים שכדאי ללמוד בהקשר.", "example": "at 7:00 / on Monday / in November"}, "17": {"pattern": "many / much / some", "tip": "שמות עצם ספירים אפשר למנות: books. לא ספירים כגון water אינם מקבלים בדרך כלל רבים. Many לספירים ו־much ללא ספירים.", "example": "many books / much water"}, "18": {"pattern": "more / most; -er / -est", "tip": "משווים בין שניים באמצעות comparative, ובין שלושה או יותר באמצעות superlative.", "example": "taller than / the tallest"}, "19": {"pattern": "can / should / must + verb", "tip": "פעלי עזר מודאליים אינם מקבלים s בגוף שלישי, ואחריהם הפועל נשאר בצורת בסיס.", "example": "She can swim. (לא cans swims)"}, "20": {"pattern": "If + present, will + verb", "tip": "בחלק התנאי נשתמש ב־Present Simple, ובתוצאה האפשרית ב־will.", "example": "If I study, I will improve."}, "21": {"pattern": "have / has + past participle", "tip": "לניסיון חיים משתמשים לעיתים ב־ever/never. כשמציינים זמן עבר מוגדר בדרך כלל משתמשים ב־Past Simple.", "example": "Have you ever visited London?"}, "22": {"pattern": "be + past participle", "tip": "משפט סביל מתאים כאשר המבצע אינו ידוע או אינו מרכזי.", "example": "English is spoken in many countries."}};
